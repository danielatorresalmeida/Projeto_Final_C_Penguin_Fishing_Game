name: Build C Project

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev

      - name: Build project
        run: |
          make clean
          make \
            CFLAGS="-Wall -Wextra -std=c11" \
            LDFLAGS="-lncursesw"